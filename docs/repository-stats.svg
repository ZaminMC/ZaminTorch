<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">ZaminTorch engineering statistics</title>
<desc id="desc">Engineering statistics for ZaminTorch.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".52" stop-color="#eef2f7"/><stop offset="1" stop-color="#e6ebf2"/></linearGradient>
  <radialGradient id="orb1"><stop offset="0" stop-color="#8bbcff" stop-opacity=".72"/><stop offset="1" stop-color="#8bbcff" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb2"><stop offset="0" stop-color="#c6a7ff" stop-opacity=".48"/><stop offset="1" stop-color="#c6a7ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".78"/><stop offset="1" stop-color="#fff" stop-opacity=".38"/></linearGradient>
  <linearGradient id="number" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#334155"/></linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#64748b" flood-opacity=".16"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="34"/></filter>
  <style>
    .bg{fill:url(#bg);stroke:#fff;stroke-opacity:.72}.glass{fill:url(#glass);stroke:#fff;stroke-opacity:.72}.title{fill:#0f172a}.label{fill:#64748b}.value{fill:#111827}.number{fill:url(#number)}.muted{fill:#94a3b8}.icon-bg{fill:#fff;fill-opacity:.72}.icon{fill:none;stroke:#64748b;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    @media(prefers-color-scheme:dark){.bg{fill:#111318;stroke:#30343c}.glass{fill:#1b1f27;fill-opacity:.78;stroke:#3a404b}.title{fill:#f8fafc}.label{fill:#9aa4b2}.value{fill:#f8fafc}.number{fill:#fff}.muted{fill:#687384}.icon-bg{fill:#262c36}.icon{stroke:#aab4c2}}
  </style>
</defs>
<rect x="10" y="10" width="1180" height="400" rx="34" class="bg" filter="url(#shadow)"/>
<circle cx="1030" cy="-20" r="270" fill="url(#orb1)" filter="url(#soft)"/>
<circle cx="210" cy="430" r="230" fill="url(#orb2)" filter="url(#soft)"/>
<circle cx="58" cy="59" r="6" fill="#0f172a" opacity=".88"/>
<text x="78" y="64" class="title" font-size="13px" font-weight="700" letter-spacing="2.5px">ZAMINTORCH</text>
<text x="78" y="88" class="label" font-size="9px" font-weight="650" letter-spacing="1.7px">ENGINEERING METRICS</text>
<rect x="1010" y="43" width="118" height="30" rx="15" class="glass"/>
<text x="1069" y="62" class="label" font-size="9px" font-weight="700" text-anchor="middle" letter-spacing="1.4px">DEVELOP</text>
<text x="56" y="190" class="number" font-size="72px" font-weight="700">245,312</text>
<text x="58" y="218" class="label" font-size="10px" font-weight="700" letter-spacing="2.1px">JAVA LINES</text>
<text x="58" y="244" class="muted" font-size="11px">tracked codebase</text>
<rect x="690" y="116" width="438" height="112" rx="30" class="glass"/>
<text x="720" y="151" class="label" font-size="9px" font-weight="700" letter-spacing="1.5px">LATEST RELEASE</text>
<text x="720" y="190" class="value" font-size="27px" font-weight="650">v0.2.0-dev.25</text>
<text x="720" y="211" class="muted" font-size="10px">GitHub</text>
<line x1="56" y1="275" x2="1144" y2="275" stroke="#94a3b8" stroke-opacity=".18"/>
<rect x="56" y="298" width="258" height="76" rx="22" class="glass"/>
<circle cx="85" cy="336" r="15" class="icon-bg"/><path d="M85 330l-6 0M85 336l4-4M85 336l4 4M85 336l-1-10" class="icon"/>
<text x="111" y="330" class="label" font-size="9px" font-weight="650" letter-spacing="1.2px">PRS OPEN</text><text x="111" y="353" class="value" font-size="18px" font-weight="650">0</text>
<rect x="330" y="298" width="258" height="76" rx="22" class="glass"/>
<circle cx="359" cy="336" r="15" class="icon-bg"/><path d="M353 336l4 4 8-8" class="icon"/>
<text x="385" y="330" class="label" font-size="9px" font-weight="650" letter-spacing="1.2px">PRS CLOSED</text><text x="385" y="353" class="value" font-size="18px" font-weight="650">8</text>
<rect x="604" y="298" width="258" height="76" rx="22" class="glass"/>
<circle cx="633" cy="336" r="15" class="icon-bg"/><circle cx="633" cy="336" r="7" class="icon"/><path d="M630 336h6" class="icon"/>
<text x="659" y="330" class="label" font-size="9px" font-weight="650" letter-spacing="1.2px">ISSUES OPEN</text><text x="659" y="353" class="value" font-size="18px" font-weight="650">0</text>
<rect x="878" y="298" width="266" height="76" rx="22" class="glass"/>
<circle cx="907" cy="336" r="15" class="icon-bg"/><path d="M901 336l4 4 8-8" class="icon"/>
<text x="933" y="330" class="label" font-size="9px" font-weight="650" letter-spacing="1.2px">ISSUES CLOSED</text><text x="933" y="353" class="value" font-size="18px" font-weight="650">0</text>
</svg>
