name: release

# The release pipeline — every push to develop cuts the next numbered dev
# build automatically:
#
#   1. compute N over BOTH tag ledgers (legacy v0.2.0-dev.N and the current
#      torch-1.8.8-N scheme — the numbering continues: dev.25 -> 26);
#   2. stamp the version into zamin-launcher/build.gradle.kts (distVersion)
#      and UpdateChecker.BUILD_VERSION in the workspace;
#   3. sync the bump back to develop as an Abasing-authored "[skip ci]"
#      commit (the loop-breaker: the pipeline's own push must not retrigger)
#      — BEFORE building, so the jar is always built from the exact tree
#      that gets tagged, even if a rebase pulls in newer commits mid-run;
#   4. run the full test suite (one retry for the three documented load
#      flakes: LifecycleEvent / HopperSystem / HopperWindow);
#   5. tag torch-1.8.8-N (lightweight, matching the v0.2.0-dev.* family);
#   6. publish the fat jar (torch-1.8.8-N.jar) + the server zip as a
#      PRERELEASE through gh, with auto-generated notes (commits since the
#      previous tag; an optional title via workflow_dispatch input or a
#      "Release-Title:" trailer in a commit message).
#
# Failure safety: a build/test failure pushes no tag and cuts no release —
# the next run (or a re-run) reuses the same number and the already-pushed
# bump commit. A run that dies between tag and release is resumed by the
# orphan-tag repair path. Everything — bump commit, tag push, release — is
# authored as Abasing through the ABASING_TOKEN secret, never
# github-actions[bot].
#
# Escape hatches:
#   - a head commit carrying [skip ci] / [ci skip] / [no ci] postpones its
#     push's release to the next push;
#   - `scripts/release.sh "title"` (or a manual workflow_dispatch) cuts an
#     off-cycle release with a title;
#   - re-running a run that already published is a no-op.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      title:
        description: "Optional release title (otherwise the Release-Title: commit trailer, or a default)"
        required: false
        type: string

# Releases queue behind each other; a cancelled mid-flight release could
# leak half-pushed state, so never cancel.
concurrency:
  group: release-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !(contains(github.event.head_commit.message, '[skip ci]') ||
        contains(github.event.head_commit.message, '[ci skip]') ||
        contains(github.event.head_commit.message, '[no ci]') ||
        contains(github.event.head_commit.message, '[skip actions]') ||
        contains(github.event.head_commit.message, '[actions skip]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout develop (as Abasing)
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.ABASING_TOKEN }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compute the next build number (dual tag ledger)
        id: version
        env:
          GH_TOKEN: ${{ secrets.ABASING_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          # Both ledgers, one numbering: torch-1.8.8-N and the legacy
          # v0.2.0-dev.N (dev.25 -> torch-1.8.8-26).
          numbered_tags() {
            git tag -l | while IFS= read -r t; do
              n=$(printf '%s' "$t" | sed -nE \
                's/^torch-1\.8\.8-([0-9]+)$/\1/p; s/^v[0-9]+\.[0-9]+\.[0-9]+-dev\.([0-9]+)$/\1/p')
              if [ -n "$n" ]; then printf '%s %s\n' "$n" "$t"; fi
            done | sort -n
          }

          LAST_LINE=$(numbered_tags | tail -1)
          if [ -n "$LAST_LINE" ]; then
            LAST_NUM=${LAST_LINE%% *}
            PREV_TAG=${LAST_LINE#* }
          else
            LAST_NUM=0
            PREV_TAG=""
          fi

          HEAD_TAG=$(git tag --points-at HEAD | grep -E '^torch-1\.8\.8-[0-9]+$' | sed -n '1p' || true)

          SKIP=false
          REPAIR=false
          N=$(( LAST_NUM + 1 ))
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$HEAD_TAG" ]; then
            if gh release view "$HEAD_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "HEAD is already released as $HEAD_TAG — nothing to do."
              SKIP=true
            else
              # A previous run died between the tag push and the release:
              # resume that number instead of burning it.
              echo "Found orphan tag $HEAD_TAG at HEAD (release missing) — resuming it."
              N=$(printf '%s' "$HEAD_TAG" | sed -nE 's/^torch-1\.8\.8-([0-9]+)$/\1/p')
              REPAIR=true
            fi
          fi

          {
            echo "number=$N"
            echo "version=1.8.8-$N"
            echo "tag=torch-1.8.8-$N"
            echo "prev_tag=$PREV_TAG"
            echo "repair=$REPAIR"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"
          echo "Next release: torch-1.8.8-$N (ledger high: $LAST_NUM, previous tag: ${PREV_TAG:-none}, repair: $REPAIR, skip: $SKIP)"

      - name: Stamp the version (distVersion + BUILD_VERSION)
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          sed -i "s/^val distVersion = \"[^\"]*\"/val distVersion = \"$V\"/" \
            zamin-launcher/build.gradle.kts
          sed -i "s/^    static final String BUILD_VERSION = \"[^\"]*\";/    static final String BUILD_VERSION = \"$V\";/" \
            zamin-launcher/src/main/java/net/zaminmc/torch/launcher/UpdateChecker.java
          echo "--- stamped:"
          grep -n '^val distVersion' zamin-launcher/build.gradle.kts
          grep -n 'BUILD_VERSION = "' zamin-launcher/src/main/java/net/zaminmc/torch/launcher/UpdateChecker.java

      - name: Sync the version bump back to develop (as Abasing)
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.repair != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "Zamin Bhutto"
          git config user.email "140362885+Abasing@users.noreply.github.com"
          if git diff --quiet; then
            echo "source already carries $TAG — no bump commit needed"
            exit 0
          fi
          git add zamin-launcher/build.gradle.kts \
                  zamin-launcher/src/main/java/net/zaminmc/torch/launcher/UpdateChecker.java
          git commit -m "release: $TAG — version bump [skip ci]"
          for attempt in 1 2; do
            if git pull --rebase origin develop && git push origin develop; then
              echo "bump pushed as $(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "::warning::push raced a concurrent commit (attempt $attempt) — rebasing and retrying"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::could not sync the bump (develop moved underneath twice) — re-run the workflow"
          exit 1

      - name: Build + full test suite (one retry for the documented load flakes)
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if ! ./gradlew --no-daemon build :zamin-launcher:serverDist; then
            echo "::warning::first build failed — retrying once (documented load flakes: LifecycleEvent/HopperSystem/HopperWindow each pass in isolation)"
            ./gradlew --no-daemon build :zamin-launcher:serverDist
          fi
          V="${{ steps.version.outputs.version }}"
          ls -la "zamin-launcher/build/libs/torch-$V.jar" \
                 "zamin-launcher/build/dist/ZaminTorch-server-$V.zip"

      - name: Tag the release (lightweight, like the v0.2.0-dev.* family)
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
          fi
          if ! git push origin "refs/tags/$TAG"; then
            # Rejected: the tag exists remotely. Accept only if it is the
            # exact same tree (a racing/repaired run), never silently move it.
            git fetch --tags --force origin
            if [ "$(git rev-parse "refs/tags/$TAG")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::remote tag $TAG points at a different commit — investigate manually"
              exit 1
            fi
            echo "remote tag $TAG already points at HEAD — accepting"
          fi
          echo "tagged $(git rev-parse --short HEAD) as $TAG"

      - name: Generate the release notes
        if: steps.version.outputs.skip != 'true'
        env:
          INPUT_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail
          N="${{ steps.version.outputs.number }}"
          V="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          PREV="${{ steps.version.outputs.prev_tag }}"

          # The version-bump commits ("release: torch-…") are pipeline
          # infrastructure, not changes — keep them out of the notes.
          if git log -1 --format=%s HEAD | grep -q '^release: torch-'; then
            RANGE_END="HEAD^"
          else
            RANGE_END="HEAD"
          fi
          if [ -n "$PREV" ]; then RANGE="$PREV..$RANGE_END"; else RANGE="$RANGE_END"; fi

          COUNT=$(git rev-list --count "$RANGE")
          SHORTSTAT=$(git diff --shortstat "$RANGE" || true)
          SHORT_SHA=$(git rev-parse --short "$RANGE_END")

          # Title precedence: dispatch input > Release-Title: trailer > default.
          TITLE="$INPUT_TITLE"
          if [ -z "$TITLE" ]; then
            # grep without -m1 / head: an early-exiting consumer would SIGPIPE
            # git log under pipefail and silently lose the title.
            TITLE=$(git log --format=%B "$RANGE" | grep '^Release-Title:' \
                    | sed -n '1s/^Release-Title:[[:space:]]*//p' || true)
          fi
          if [ -z "$TITLE" ]; then TITLE="Torch 1.8.8 build $N"; fi
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "title: $TITLE"

          {
            echo "Dev build \`$TAG\` — auto-cut from \`develop\` @ \`$SHORT_SHA\` ($COUNT commit(s) since \`${PREV:-the beginning}\`$([ -n "$SHORTSTAT" ] && echo ", $SHORTSTAT" || echo))."
            echo
            if [ -n "$PREV" ]; then
              echo "Full diff: [$PREV...$TAG](https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG)"
              echo
            fi
            echo "### Changes"
            echo
            { git log --reverse --format='- %s' "$RANGE" \
              | grep -v '^- release: torch-' \
              | awk '{ if (length($0) > 200) print substr($0, 1, 200) "…"; else print }' || true; }
            echo
            echo "<details><summary>Full commit messages</summary>"
            echo
            { git log --reverse --format='%h %s%n%n%b%n---' "$RANGE" \
              | grep -v '^[0-9a-f]\{7\} release: torch-' || true; }
            echo
            echo "</details>"
            echo
            echo "### Artifacts"
            echo
            echo "- \`torch-$V.jar\` — the fat server jar (every module + netty), Java 21+."
            echo "- \`ZaminTorch-server-$V.zip\` — the jar plus \`start.sh\` / \`start.bat\` / \`start.ps1\`, QUICKSTART and the default \`zamin.properties\`."
            echo
            echo "Boot: unzip, \`./start.sh\`, connect a vanilla 1.8.8 client to port 25565. The launcher prints an update prompt when a newer build is published."
          } > notes.md
          echo "--- notes.md (first 40 lines):"
          head -40 notes.md

      - name: Publish the prerelease (as Abasing)
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.ABASING_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --verify-tag \
            --title "$TITLE" \
            --notes-file notes.md \
            "zamin-launcher/build/libs/torch-$V.jar" \
            "zamin-launcher/build/dist/ZaminTorch-server-$V.zip"
          echo "--- published:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isPrerelease,author,url \
            -q '"name=" + .name + " tag=" + .tagName + " prerelease=" + (.isPrerelease|tostring) + " author=" + .author.login + " url=" + .url'
