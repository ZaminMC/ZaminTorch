name: Repository Statistics Card

# The public card lives on main, while all development measurements come from develop.
# It updates when develop changes and on a daily schedule for GitHub metadata.

on:
  push:
    branches:
      - develop
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: repository-stats-card
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Fluent repository card
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Generate statistics card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/repo_stats_card.py

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Copy generated card into main worktree
        run: |
          mkdir -p docs
          cp "$GITHUB_WORKSPACE/docs/repository-stats.svg" docs/repository-stats.svg
