name: Repository Statistics Card

# The public card lives on main, while all development measurements come from develop.
# The workflow itself intentionally lives only on main so the generated artifact stays
# out of the active development branch. GitHub metadata is refreshed every 6 hours.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: repository-stats-card
  cancel-in-progress: true

env:
  CARD_SNAPSHOT: /tmp/zamintorch-repository-stats.svg

jobs:
  generate:
    name: Generate Fluent repository card
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Generate statistics card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/repo_stats_card.py
          cp docs/repository-stats.svg "$CARD_SNAPSHOT"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install generated card
        run: |
          mkdir -p docs
          cp "$CARD_SNAPSHOT" docs/repository-stats.svg

      - name: Commit and push card to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/repository-stats.svg
          if git diff --cached --quiet; then
            echo "Repository statistics card is already current."
          else
            git commit -m "docs: update repository statistics card [skip ci]"
            git push origin HEAD:main
          fi
