name: Repository Statistics Card

# Measurements come from develop. The rendered card and README stay on main.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: repository-stats-card
  cancel-in-progress: true

env:
  CARD_SNAPSHOT: /tmp/zamintorch-repository-stats.svg

jobs:
  generate:
    name: Generate repository card
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          path: source

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          path: main

      - name: Generate statistics
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ../main/.github/scripts/repo_stats_card.py
          cp docs/repository-stats.svg "$CARD_SNAPSHOT"

      - name: Update main card and README
        run: |
          cp "$CARD_SNAPSHOT" main/docs/repository-stats.svg
          python3 - <<'PY'
          from pathlib import Path
          main = Path("main")
          readme = main / "README.md"
          text = readme.read_text(encoding="utf-8")
          start = "<!-- REPOSITORY_STATS:START -->"
          end = "<!-- REPOSITORY_STATS:END -->"
          card = """<p align="center">
            <img src="docs/repository-stats.svg" alt="ZaminTorch engineering statistics" width="100%" />
          </p>

          <p align="center">
            <a href="https://github.com/ZaminMC/ZaminTorch/tree/develop">Java LOC</a>
            · <a href="https://github.com/ZaminMC/ZaminTorch/releases/latest">Latest release</a>
            · <a href="https://github.com/ZaminMC/ZaminTorch/pulls">PRs open</a>
            · <a href="https://github.com/ZaminMC/ZaminTorch/pulls?q=is%3Apr+is%3Aclosed">PRs closed</a>
            · <a href="https://github.com/ZaminMC/ZaminTorch/issues?q=is%3Aopen">Issues open</a>
            · <a href="https://github.com/ZaminMC/ZaminTorch/issues?q=is%3Aclosed">Issues closed</a>
          </p>"""
          if start not in text or end not in text:
              raise SystemExit("README statistics markers are missing")
          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)
          readme.write_text(before + start + "\n" + card + "\n" + end + after, encoding="utf-8")
          PY

      - name: Commit and push main
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/repository-stats.svg README.md
          if git diff --cached --quiet; then
            echo "Repository statistics card is already current."
          else
            git commit -m "docs: update repository statistics card [skip ci]"
            git push origin HEAD:main
          fi
