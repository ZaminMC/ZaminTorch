# The CI Phase A parallelisation baseline (the approved proposal — the
# two sequential test tasks, zamin-core:test ~21m and
# zamin-protocol-v1_8_8:test ~14.5m, were 88% of the last green build).
#
# Parallel task execution across modules. Works under --no-daemon: Gradle 8
# forks a single-use daemon and --parallel still applies — the protocol
# suite's compile+test overlaps the core suite instead of queueing behind
# it.
org.gradle.parallel=true
#
# Local build cache. The release workflow's existing `setup-java` with
# `cache: gradle` preserves the WHOLE ~/.gradle/caches tree across runs
# (verified against the action's source: the gradle package manager's path
# IS ~/.gradle/caches, which contains build-cache-1), so unchanged modules
# can compile-hit between pushes. The version stamping still invalidates
# the launcher module alone, by design.
org.gradle.caching=true
#
# Build JVM headroom on the 4-vCPU / 16-GB runner (the test forks carry
# their own maxHeapSize, sized in the root build script).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
